<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Lost Piano | Portfolio</title>

<link rel="icon" type="image/png" href="favicon.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Aclonica&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7fbfe;
            color: #222;
        }

        .project-page {
            max-width: 1000px;
            margin: 0 auto;
            padding: 50px 30px 100px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 50px;
            color: #75add3;
            text-decoration: none;
            font-weight: bold;
        }

        .back-link:hover {
            text-decoration: underline;
        }
.project-hero {
    margin-bottom: 70px;
}

.project-number {
    color: #75add3;
    text-transform: uppercase;
    letter-spacing: 3px;
    font-size: 13px;
    margin-bottom: 18px;
}

.project-hero h1 {
    font-family: "Aclonica", sans-serif;
    font-size: clamp(55px, 9vw, 110px);
    line-height: 1;
    margin: 0 0 20px;
    font-weight: 400;
}

.project-role {
    color: #75add3;
    text-transform: uppercase;
    letter-spacing: 3px;
    font-size: 13px;
    margin-bottom: 0;
}

.project-content {
    display: grid;
    grid-template-columns: 420px 1fr;
    gap: 70px;
    align-items: start;
}

.project-image-wrap {
    background: #e1f1fb;
    padding: 20px;
    border-radius: 25px;
    width: 100%;
    box-sizing: border-box;
}

.project-image {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 15px;
}

.project-info {
    max-width: 550px;
    padding-top: 10px;
}

.project-info h2 {
    font-size: 28px;
    margin-top: 40px;
}

.project-info h2:first-child {
    margin-top: 0;
}

.project-info p {
    font-size: 17px;
    line-height: 1.7;
}

@media (max-width: 800px) {
    .project-content {
        grid-template-columns: 1fr;
        gap: 35px;
    }

    .project-image-wrap {
        max-width: 420px;
        margin: 0 auto;
    }

    .project-info {
        max-width: 100%;
    }
}
        .project-video {
    margin-top: 80px;
}

.project-video h2 {
    font-size: 28px;
    margin-bottom: 25px;
}

.project-video video {
    display: block;
    width: 100%;
    border-radius: 25px;
}
    </style>
</head>

<body>

    <main class="project-page">

        <a href="index.html" class="back-link">← Back to Projects</a>

 <section class="project-hero">

    <div class="project-number">02 / PROJECT</div>

    <h1>The Lost Piano</h1>

    <p class="project-role">
        Composition · Sound Design
    </p>

</section>

<div class="project-content">

    <div class="project-image-wrap">
        <img
            src="The lost piano.jpg"
            alt="The Lost Piano project"
            class="project-image"
        >
    </div>

    <div class="project-info">

        <h2>About the Project</h2>
        <p>
            Project information will go here.
        </p>

        <h2>My Role</h2>
        <p>
            Composer · Sound Designer
        </p>

        <h2>What I Worked On</h2>
        <p>
            More information will go here.
        </p>

    </div>

</div>
        <section class="project-video">

    <h2>Watch the Project</h2>

    <video controls preload="metadata">
        <source src="the-lost-piano.mp4" type="video/mp4">
        Your browser does not support video playback.
    </video>

</section>
    </main>

</body>
</html>
